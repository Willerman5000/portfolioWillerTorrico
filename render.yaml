services:
  - type: web
    name: willer-portfolio
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        value: https://kzmczlhfmrhhxopzpmze.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PUBLIC_CACHE_SECONDS
        value: "60"
      - key: CONTACT_LIMIT_PER_HOUR
        value: "5"
      - key: MAX_UPLOAD_MB
        value: "6"
